version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26100-backend
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - SECRET_KEY=sih26100-gem-procurement-compliance-secret-key-2026
      - USE_MOCK_PORTALS=True
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "python seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih26100-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
