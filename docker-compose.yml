version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sih26100-postgres
    environment:
      POSTGRES_USER: gem_user
      POSTGRES_PASSWORD: gem_password
      POSTGRES_DB: gem_compliance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem_user -d gem_compliance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26100-backend
    environment:
      - DATABASE_URL=postgresql://gem_user:gem_password@postgres:5432/gem_compliance_db
      - SECRET_KEY=sih26100-gem-procurement-compliance-secret-key-2026
      - USE_MOCK_PORTALS=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih26100-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
